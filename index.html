

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>mon premier site</title>
<style>
/* TEXTE CLIGNOTANT */
.clignote {
color: red;
font-weight: bold;
animation: clignoter 1s infinite;
text-align: left;
margin-left: 20px;
}
@keyframes clignoter {
0% { opacity: 1; }
50% { opacity: 0; }
100% { opacity: 1; }
}

/* TEXTE PROMO ANIMÉ */
.promo {
color: gold;
font-weight: bold;
font-size: 18px;
animation: fade 2s infinite;
margin-top: 10px;
}
@keyframes fade {
0%,100% {opacity: 1;}
50% {opacity: 0.3;}
}

/* STYLE GLOBAL */
body {
text-align: center;
font-family: Arial, sans-serif;
background: #f9f9f9;
overflow-x: hidden;
}

/* SLIDER CATALOGUE MINIATURES */
.slider-container {
display: flex;
overflow: hidden;
max-width: 100%;
margin: 20px auto;
gap: 10px;
}
.slider-track {
display: flex;
transition: transform 0.5s ease-in-out;
}

/* CATALOGUE MINIATURE */
.catalogue-container {
flex: 0 0 auto;
position: relative;
cursor: pointer;
transition: transform 0.3s ease, filter 0.3s ease, box-shadow 0.3s ease;
}
.catalogue-container:hover {
transform: scale(1.05);
filter: brightness(1.1);
box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}
.catalogue-container img {
display: block;
width: 200px;
height: 200px;
object-fit: cover;
}
.catalogue-container span {
position: absolute;
bottom: 5px;
left: 5px;
color: white;
background: rgba(0,0,0,0.5);
padding: 3px 6px;
border-radius: 3px;
font-size: 14px;
}

/* GALERIE LIGHTBOX */
#gallery {
display: none;
position: fixed;
top:0;
left:0;
width:100%;
height:100%;
background: rgba(0,0,0,0.9);
text-align: center;
overflow: hidden;
z-index: 1000;
}

#gallery img.main-img {
max-width: 80%;
max-height: 70%;
margin: 20px auto;
display: none;
transition: opacity 0.5s ease;
}

#gallery img.active {
display: block;
opacity: 1;
}

#gallery .thumbnails {
display: flex;
justify-content: center;
margin-top: 15px;
gap: 10px;
}

#gallery .thumbnails img {
width: 80px;
height: 80px;
object-fit: cover;
cursor: pointer;
opacity: 0.7;
border: 2px solid transparent;
transition: transform 0.3s, opacity 0.3s, border 0.3s;
}

#gallery .thumbnails img:hover,
#gallery .thumbnails img.active-thumb {
transform: scale(1.1);
opacity: 1;
border: 2px solid red;
}

#gallery button, #gallery span {
margin: 10px;
padding: 10px 20px;
font-size: 18px;
cursor: pointer;
background: #fff;
border: none;
border-radius: 5px;
}

#gallery span {
color: white;
font-size: 24px;
cursor: pointer;
}

#gallery h2 {
color: white;
margin-top: 20px;
}
</style>
</head>
<body>

<h1 style="color: red;">LIVRAISON OFFERTE DÈS 20 € !</h1>
<p class="clignote">Cliquez ici 👇</p>
<p class="promo">Promo spéciale aujourd'hui 💎</p>

<!-- SLIDER MINIATURES -->
<div class="slider-container">
<div class="slider-track" id="slider-track">
<div class="catalogue-container" onclick="openGallery(0)">
<img src="thumb_CHEZGABYBIJOUx.png" alt="Bijou A" loading="lazy">
<span>Bijou A - 20€</span>
</div>
<div class="catalogue-container" onclick="openGallery(1)">
<img src="thumb_CHEZ.png" alt="Bijou B" loading="lazy">
<span>Bijou B - 25€</span>
</div>
<div class="catalogue-container" onclick="openGallery(2)">
<img src="thumb_CHEZGABBIJOUX.png" alt="Bijou C" loading="lazy">
<span>Bijou C - 15€</span>
</div>
<div class="catalogue-container" onclick="openGallery(3)">
<img src="thumb_CHEZGABYBI.png" alt="Bijou D" loading="lazy">
<span>Bijou D - 30€</span>
</div>
<!-- Ajoute ici d'autres bijoux si besoin -->
</div>
</div>

<p style="color: blue;">catalogue bijoux acier inoxydable 974</p>

<!-- GALERIE LIGHTBOX -->
<div id="gallery">
<h2>Galerie</h2>

<img src="CHEZGABYBIJOUx.png" class="main-img" loading="lazy">
<img src="CHEZ.png" class="main-img" loading="lazy">
<img src="CHEZGABBIJOUX.png" class="main-img" loading="lazy">
<img src="CHEZGABYBI.png" class="main-img" loading="lazy">

<div class="thumbnails">
<img src="thumb_CHEZGABYBIJOUx.png" onclick="showImage(0)" loading="lazy">
<img src="thumb_CHEZ.png" onclick="showImage(1)" loading="lazy">
<img src="thumb_CHEZGABBIJOUX.png" onclick="showImage(2)" loading="lazy">
<img src="thumb_CHEZGABYBI.png" onclick="showImage(3)" loading="lazy">
</div>

<div>
<button onclick="prevImage()">⬅ Précédent</button>
<button onclick="nextImage()">Suivant ➡</button>
<span onclick="closeGallery()">Fermer ✖</span>
</div>
</div>

<script>
// SLIDER AUTOMATIQUE
const sliderTrack = document.getElementById("slider-track");
let sliderIndex = 0;
function slideSlider() {
sliderIndex++;
if (sliderIndex >= sliderTrack.children.length) sliderIndex = 0;
sliderTrack.style.transform = `translateX(-${sliderIndex * 220}px)`;
}
setInterval(slideSlider, 3000);

// GALERIE LIGHTBOX
let currentIndex = 0;
const mainImages = document.querySelectorAll("#gallery .main-img");
const thumbs = document.querySelectorAll("#gallery .thumbnails img");
let sliderInterval;

function openGallery(index) {
currentIndex = index;
updateGallery();
document.getElementById("gallery").style.display = "block";
startSlider();
}

function closeGallery() {
document.getElementById("gallery").style.display = "none";
stopSlider();
}

function showImage(index) {
currentIndex = index;
updateGallery();
resetSlider();
}

function updateGallery() {
mainImages.forEach((img,i) => img.classList.toggle("active", i === currentIndex));
thumbs.forEach((img,i) => img.classList.toggle("active-thumb", i === currentIndex));
}

function prevImage() {
currentIndex = (currentIndex -1 + mainImages.length) % mainImages.length;
updateGallery();
resetSlider();
}

function nextImage() {
currentIndex = (currentIndex +1) % mainImages.length;
updateGallery();
resetSlider();
}

function startSlider() { sliderInterval = setInterval(nextImage, 3000); }
function stopSlider() { clearInterval(sliderInterval); }
function resetSlider() { stopSlider(); startSlider(); }

// LIKES & PANIER
let likes = {};
function like(id){ if(!likes[id]) likes[id]=0; likes[id]++; document.getElementById(id+'-count').innerText = likes[id]; }
let cart=[];
function addToCart(item){ cart.push(item); alert(item+' ajouté au panier !'); console.log(cart); }
</script>

</body>
</html>
