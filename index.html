<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>mon premier site</title>
<style>
body {
text-align: center;
font-family: Arial, sans-serif;
background: #f9f9f9;
}

.catalogue {
max-width: 100%;
height: auto;
display: block;
margin: 20px auto;
cursor: pointer;
}

#gallery {
display: none; 
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.8);
text-align: center;
overflow-y: auto;
}

#gallery img {
max-width: 90%;
max-height: 90%;
margin: 20px auto;
display: block;
}

#gallery button {
margin: 5px;
padding: 10px 15px;
font-size: 16px;
cursor: pointer;
}

#gallery span {
color: white;
font-size: 24px;
cursor: pointer;
display: block;
margin-top: 20px;
}

#gallery h2 {
color: white;
margin-top: 50px;
}
</style>
</head>
<body>

<h1>LIVRAISON OFFERTE DÈS 20€ !</h1>


<img src="CHEZGABYBIJOUx.png" alt="Catalogue" class="catalogue" onclick="openGallery()">


<img src="CHEZ.png" alt="logo CHEZ" style="max-width:100%; height:auto; display:block; margin:0 auto 20px auto;">
<img src="CHEZGABBIJOUX.png" alt="logo CHEZGAB" style="max-width:100%; height:auto; display:block; margin:0 auto 20px auto;">
<img src="CHEZGABYBI.png" alt="logo CHEZGABYBI" style="max-width:100%; height:auto; display:block; margin:0 auto 20px auto;">

<p>ceci est mon site web catalogue</p>


<div id="gallery">
<h2>Galerie</h2>


<img src="10.png" alt="10.png">
<button onclick="like('10.png')">❤️ J'aime</button> <span id="10.png-count">0</span>
<button onclick="addToCart('10.png')">🛒 Ajouter au panier</button>


<img src="photo2.png" alt="Photo 2">
<button onclick="like('photo2')">❤️ J'aime</button> <span id="photo2-count">0</span>
<button onclick="addToCart('photo2')">🛒 Ajouter au panier</button>


<img src="photo3.png" alt="Photo 3">
<button onclick="like('photo3')">❤️ J'aime</button> <span id="photo3-count">0</span>
<button onclick="addToCart('photo3')">🛒 Ajouter au panier</button>

<img src="photo4.png" alt="Photo 4">
<button onclick="like('photo4')">❤️ J'aime</button> <span id="photo4-count">0</span>
<button onclick="addToCart('photo4')">🛒 Ajouter au panier</button>


<img src="photo5.png" alt="Photo 5">
<button onclick="like('photo5')">❤️ J'aime</button> <span id="photo5-count">0</span>
<button onclick="addToCart('photo5')">🛒 Ajouter au panier</button>


<img src="photo6.png" alt="Photo 6">
<button onclick="like('photo6')">❤️ J'aime</button> <span id="photo6-count">0</span>
<button onclick="addToCart('photo6')">🛒 Ajouter au panier</button>

<span onclick="closeGallery()">Fermer ✖</span>
</div>

<script>

function openGallery() {
document.getElementById("gallery").style.display = "block";
}
function closeGallery() {
document.getElementById("gallery").style.display = "none";
}


let likes = {};
function like(id) {
if (!likes[id]) likes[id] = 0;
likes[id]++;
document.getElementById(id + '-count').innerText = likes[id];
}


let cart = [];
function addToCart(item) {
cart.push(item);
alert(item + ' ajouté au panier !');
console.log(cart); // voir le contenu du panier dans la console
}
</script>

</body>
</html>
