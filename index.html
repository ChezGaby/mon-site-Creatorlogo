


<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>mon premier site</title>
<style>
/* Texte clignotant */
.clignote {
color: red;
font-weight: bold;
animation: clignoter 1s infinite;
text-align: left;
margin-left: 20px;
}
@keyframes clignoter {
0% { opacity: 1; }
50% { opacity: 0; }
100% { opacity: 1; }
}

/* Style global */
body {
text-align: center;
font-family: Arial, sans-serif;
background: #f9f9f9;
}

/* Images catalogue */
.catalogue {
max-width: 100%;
height: auto;
display: block;
margin: 20px auto;
cursor: pointer;
transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.catalogue:hover {
transform: scale(1.05);
box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

/* Galerie lightbox */
#gallery {
display: none;
position: fixed;
top:0;
left:0;
width:100%;
height:100%;
background: rgba(0,0,0,0.9);
text-align: center;
overflow: hidden;
z-index: 1000;
}

#gallery img {
max-width: 90%;
max-height: 80%;
margin: 40px auto;
display: none;
transition: opacity 0.5s ease;
}

#gallery img.active {
display: block;
opacity: 1;
}

#gallery button, #gallery span {
margin: 10px;
padding: 10px 20px;
font-size: 18px;
cursor: pointer;
}

#gallery button:hover {
background: #ffcccc;
transform: scale(1.05);
}

#gallery span {
color: white;
font-size: 24px;
cursor: pointer;
}

#gallery h2 {
color: white;
margin-top: 20px;
}
</style>
</head>
<body>

<h1 style="color: red;">LIVRAISON OFFERTE DÈS 20 € !</h1>
<p class="clignote">Cliquez ici 👇 </p>

<!-- Catalogue -->
<img src="CHEZGABYBIJOUx.png" alt="Catalogue" class="catalogue" onclick="openGallery(0)" loading="lazy">
<img src="CHEZ.png" alt="logo CHEZ" style="max-width:100%; height:auto; display:block; margin:0 auto 20px auto;" loading="lazy">
<img src="CHEZGABBIJOUX.png" alt="logo CHEZGAB" style="max-width:100%; height:auto; display:block; margin:0 auto 20px auto;" loading="lazy">
<img src="CHEZGABYBI.png" alt="logo CHEZGABYBI" style="max-width:100%; height:auto; display:block; margin:0 auto 20px auto;" loading="lazy">

<p style="color: blue;">catalogue bijoux acier inoxydable 974</p>

<!-- Galerie lightbox -->
<div id="gallery">
<h2>Galerie</h2>

<img src="10.png" alt="10.png" class="gallery-img" loading="lazy">
<img src="photo2.png" alt="Photo 2" class="gallery-img" loading="lazy">
<img src="photo3.png" alt="Photo 3" class="gallery-img" loading="lazy">
<img src="photo4.png" alt="Photo 4" class="gallery-img" loading="lazy">
<img src="photo5.png" alt="Photo 5" class="gallery-img" loading="lazy">
<img src="photo6.png" alt="Photo 6" class="gallery-img" loading="lazy">

<div>
<button onclick="prevImage()">⬅ Précédent</button>
<button onclick="nextImage()">Suivant ➡</button>
<span onclick="closeGallery()">Fermer ✖</span>
</div>
</div>

<script>
let currentIndex = 0;
const images = document.querySelectorAll("#gallery .gallery-img");

function openGallery(index) {
currentIndex = index;
images.forEach(img => img.classList.remove("active"));
images[currentIndex].classList.add("active");
document.getElementById("gallery").style.display = "block";
}

function closeGallery() {
document.getElementById("gallery").style.display = "none";
}

// Navigation
function prevImage() {
images[currentIndex].classList.remove("active");
currentIndex = (currentIndex - 1 + images.length) % images.length;
images[currentIndex].classList.add("active");
}

function nextImage() {
images[currentIndex].classList.remove("active");
currentIndex = (currentIndex + 1) % images.length;
images[currentIndex].classList.add("active");
}

// Likes et panier
let likes = {};
function like(id) {
if(!likes[id]) likes[id] = 0;
likes[id]++;
document.getElementById(id + "-count").innerText = likes[id];
}

let cart = [];
function addToCart(item) {
cart.push(item);
alert(item + " ajouté au panier !");
console.log(cart);
}
</script>

</body>
</html>
