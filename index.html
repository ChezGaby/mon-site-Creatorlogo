

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Bague - Mon site</title>
<style>
/* Texte doré scintillant */
.dore {
font-weight: bold;
font-size: 28px;
background: linear-gradient(270deg, #FFD700, #FFA500, #FFD700, #FFF5BA);
background-size: 400% 400%;
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
animation: paillettes 5s ease infinite;
margin-top: -10px;
position: relative;
z-index: 2;
}
@keyframes paillettes {
0% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}

/* Conteneur paillettes */
.paillettes-container {
position: relative;
display: inline-block;
}
.paillettes-container .sparkle {
position: absolute;
width: 6px;
height: 6px;
background: radial-gradient(circle, #fff 0%, #FFD700 60%, transparent 100%);
border-radius: 50%;
animation: sparkleFall 5s linear infinite;
opacity: 0.8;
}
@keyframes sparkleFall {
from { transform: translateY(-20px) scale(0.5); opacity: 1; }
to { transform: translateY(60px) scale(0); opacity: 0; }
}

/* Style global */
body {
text-align: center;
font-family: Arial, sans-serif;
background: #f9f9f9;
overflow-x: hidden;
}

/* Galerie lightbox */
#gallery {
display: block;
position: fixed;
top:0;
left:0;
width:100%;
height:100%;
background: rgba(0,0,0,0.9);
text-align: center;
overflow: hidden;
z-index: 1000;
}

#gallery img.main-img {
max-width: 80%;
max-height: 70%;
margin: 20px auto;
display: none;
transition: opacity 0.5s ease;
}

#gallery img.active {
display: block;
opacity: 1;
}

#gallery .thumbnails {
display: flex;
justify-content: center;
margin-top: 15px;
gap: 10px;
}

#gallery .thumbnails img {
width: 80px;
height: 80px;
object-fit: cover;
cursor: pointer;
opacity: 0.7;
border: 2px solid transparent;
transition: transform 0.3s, opacity 0.3s, border 0.3s;
}

#gallery .thumbnails img:hover,
#gallery .thumbnails img.active-thumb {
transform: scale(1.1);
opacity: 1;
border: 2px solid red;
}

#gallery button, #gallery span {
margin: 10px;
padding: 10px 20px;
font-size: 18px;
cursor: pointer;
background: #fff;
border: none;
border-radius: 5px;
}

#gallery span {
color: white;
font-size: 24px;
cursor: pointer;
}

#gallery h2 {
color: white;
margin-top: 20px;
}
</style>
</head>
<body>

<h1 style="color: red;">LIVRAISON OFFERTE DÈS 20 € !</h1>

<!-- Texte doré + paillettes -->
<div class="paillettes-container">
<p class="dore">Bijoux acier inoxydable ✨</p>
</div>

<!-- Galerie lightbox -->
<div id="gallery">
<h2>Galerie Bagues</h2>

<!-- Images principales -->
<img src="10.png" alt="Bague 1" class="main-img" loading="lazy">
<img src="dimond.png" alt="Bague 2" class="main-img" loading="lazy">
<img src="bouclé.png" alt="Bague 3" class="main-img" loading="lazy">
<img src="ceinturclose.png" alt="Bague 4" class="main-img" loading="lazy">
<img src="double.png" alt="Bague 5" class="main-img" loading="lazy">

<!-- Miniatures -->
<div class="thumbnails">
<img src="10.png" onclick="showImage(0)" loading="lazy">
<img src="dimond.png" onclick="showImage(1)" loading="lazy">
<img src="bouclé.png" onclick="showImage(2)" loading="lazy">
<img src="ceinturclose.png" onclick="showImage(3)" loading="lazy">
<img src="double.png" onclick="showImage(4)" loading="lazy">
</div>

<!-- Contrôles -->
<div>
<button onclick="prevImage()">⬅ Précédent</button>
<button onclick="nextImage()">Suivant ➡</button>
<span onclick="closeGallery()">Fermer ✖</span>
</div>
</div>

<script>
// Générer des paillettes
const container = document.querySelector('.paillettes-container');
for (let i = 0; i < 20; i++) {
let sparkle = document.createElement('div');
sparkle.classList.add('sparkle');
sparkle.style.left = Math.random() * 100 + '%';
sparkle.style.animationDuration = (2 + Math.random() * 3) + 's';
sparkle.style.animationDelay = Math.random() * 5 + 's';
container.appendChild(sparkle);
}

// Galerie lightbox
let currentIndex = 0;
const mainImages = document.querySelectorAll("#gallery .main-img");
const thumbs = document.querySelectorAll("#gallery .thumbnails img");
let sliderInterval;

function openGallery(index) {
currentIndex = index;
updateGallery();
document.getElementById("gallery").style.display = "block";
startSlider();
}
function closeGallery() {
document.getElementById("gallery").style.display = "none";
stopSlider();
}
function showImage(index) {
currentIndex = index;
updateGallery();
resetSlider();
}
function updateGallery() {
mainImages.forEach((img, i) => {
img.classList.toggle("active", i === currentIndex);
thumbs[i].classList.toggle("active-thumb", i === currentIndex);
});
}
function prevImage() {
currentIndex = (currentIndex - 1 + mainImages.length) % mainImages.length;
updateGallery();
resetSlider();
}
function nextImage() {
currentIndex = (currentIndex + 1) % mainImages.length;
updateGallery();
resetSlider();
}
function startSlider() {
sliderInterval = setInterval(() => {
nextImage();
}, 3000);
}
function stopSlider() {
clearInterval(sliderInterval);
}
function resetSlider() {
stopSlider();
startSlider();
}

// Ouvrir gallery directement au chargement (optionnel)
openGallery(0);
</script>

</body>
</html>
