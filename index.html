
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mon premier site</title>
<style>
/* Texte doré scintillant */
.dore {
font-weight: bold;
font-size: 28px;
background: linear-gradient(270deg, #FFD700, #FFA500, #FFD700, #FFF5BA);
background-size: 400% 400%;
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
animation: paillettes 5s ease infinite;
margin-top: -10px;
position: relative;
z-index: 2;
}
@keyframes paillettes {
0% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}

/* Conteneur paillettes */
.paillettes-container {
position: relative;
display: inline-block;
}
.paillettes-container .sparkle {
position: absolute;
width: 6px;
height: 6px;
background: radial-gradient(circle, #fff 0%, #FFD700 60%, transparent 100%);
border-radius: 50%;
animation: sparkleFall 5s linear infinite;
opacity: 0.8;
}
@keyframes sparkleFall {
from { transform: translateY(-20px) scale(0.5); opacity: 1; }
to { transform: translateY(60px) scale(0); opacity: 0; }
}

/* Style global */
body {
text-align: center;
font-family: Arial, sans-serif;
background: #f9f9f9;
overflow-x: hidden;
}

/* Images du catalogue */
.catalogue img {
max-width: 100%;
height: auto;
margin: 20px auto;
cursor: pointer;
transition: transform 0.3s ease;
}
.catalogue img:hover {
transform: scale(1.05);
}

/* Galerie lightbox */
.gallery-container {
display: none;
position: fixed;
top:0;
left:0;
width:100%;
height:100%;
background: rgba(0,0,0,0.9);
text-align: center;
overflow: hidden;
z-index: 1000;
}
.gallery-container img.main-img {
max-width: 80%;
max-height: 70%;
margin: 20px auto;
display: none;
transition: opacity 0.5s ease;
}
.gallery-container img.active {
display: block;
opacity: 1;
}
.gallery-container .thumbnails {
display: flex;
justify-content: center;
margin-top: 15px;
gap: 10px;
}
.gallery-container .thumbnails img {
width: 80px;
height: 80px;
object-fit: cover;
cursor: pointer;
opacity: 0.7;
border: 2px solid transparent;
transition: transform 0.3s, opacity 0.3s, border 0.3s;
}
.gallery-container .thumbnails img:hover,
.gallery-container .thumbnails img.active-thumb {
transform: scale(1.1);
opacity: 1;
border: 2px solid red;
}
.gallery-container button, .gallery-container span {
margin: 10px;
padding: 10px 20px;
font-size: 18px;
cursor: pointer;
background: #fff;
border: none;
border-radius: 5px;
}
.gallery-container span {
color: white;
font-size: 24px;
cursor: pointer;
}
.gallery-container h2 {
color: white;
margin-top: 20px;
}
</style>
</head>
<body>

<h1 style="color: red;">LIVRAISON OFFERTE DÈS 20 € !</h1>

<div class="paillettes-container">
<p class="dore">Bijoux acier inoxydable ✨</p>
</div>

<!-- Catalogue images -->
<div class="catalogue">
<img src="CHEZGABYBIJOUx.png" onclick="openGallery('gallery1')">
<img src="CHEZ.png" onclick="openGallery('gallery2')">
<img src="CHEZGABBIJOUX.png" onclick="openGallery('gallery3')">
<img src="CHEZGABYBI.png" onclick="openGallery('gallery4')">
</div>

<!-- Logos ou autres images -->
<img src="bracelet.png" style="max-width:100%; height:auto; display:block; margin:0 auto 20px auto;">

<!-- Galeries séparées -->
<div id="gallery1" class="gallery-container">
<h2>Galerie CHEZGABYBIJOUx</h2>
<img src="10.png" class="main-img">
<img src="dimond.png" class="main-img">
<div class="thumbnails">
<img src="10.png" onclick="showImage('gallery1',0)">
<img src="dimond.png" onclick="showImage('gallery1',1)">
</div>
<button onclick="prevImage('gallery1')">⬅ Précédent</button>
<button onclick="nextImage('gallery1')">Suivant ➡</button>
<span onclick="closeGallery('gallery1')">Fermer ✖</span>
</div>

<div id="gallery2" class="gallery-container">
<h2>Galerie CHEZ</h2>
<img src="imageA.png" class="main-img">
<img src="imageB.png" class="main-img">
<div class="thumbnails">
<img src="imageA.png" onclick="showImage('gallery2',0)">
<img src="imageB.png" onclick="showImage('gallery2',1)">
</div>
<button onclick="prevImage('gallery2')">⬅ Précédent</button>
<button onclick="nextImage('gallery2')">Suivant ➡</button>
<span onclick="closeGallery('gallery2')">Fermer ✖</span>
</div>

<div id="gallery3" class="gallery-container">
<h2>Galerie CHEZGABBIJOUX</h2>
<!-- Ajoute tes images ici -->
</div>

<div id="gallery4" class="gallery-container">
<h2>Galerie CHEZGABYBI</h2>
<!-- Ajoute tes images ici -->
</div>

<script>
let currentGallery = null;
let currentIndex = 0;
let sliderInterval;

function openGallery(id) {
currentGallery = id;
currentIndex = 0;
updateGallery(id);
document.getElementById(id).style.display = "block";
startSlider(id);
}

function closeGallery(id) {
document.getElementById(id).style.display = "none";
stopSlider();
}

function showImage(id, index) {
currentGallery = id;
currentIndex = index;
updateGallery(id);
resetSlider(id);
}

function updateGallery(id) {
const gallery = document.getElementById(id);
const mainImages = gallery.querySelectorAll('.main-img');
const thumbs = gallery.querySelectorAll('.thumbnails img');
mainImages.forEach((img,i) => img.classList.toggle('active', i === currentIndex));
thumbs.forEach((thumb,i) => thumb.classList.toggle('active-thumb', i === currentIndex));
}

function startSlider(id) {
sliderInterval = setInterval(() => { nextImage(id); }, 3000);
}

function stopSlider() {
clearInterval(sliderInterval);
}

function resetSlider(id) {
stopSlider();
startSlider(id);
}

function nextImage(id) {
const gallery = document.getElementById(id);
const mainImages = gallery.querySelectorAll('.main-img');
currentIndex = (currentIndex + 1) % mainImages.length;
updateGallery(id);
}

function prevImage(id) {
const gallery = document.getElementById(id);
const mainImages = gallery.querySelectorAll('.main-img');
currentIndex = (currentIndex - 1 + mainImages.length) % mainImages.length;
updateGallery(id);
}

// Générer des paillettes
const container = document.querySelector('.paillettes-container');
for (let i = 0; i < 20; i++) {
let sparkle = document.createElement('div');
sparkle.classList.add('sparkle');
sparkle.style.left = Math.random() * 100 + '%';
sparkle.style.animationDuration = (2 + Math.random() * 3) + 's';
sparkle.style.animationDelay = Math.random() * 5 + 's';
container.appendChild(sparkle);
}
</script>
</body>
</html>
