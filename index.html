<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>mon premier site</title>
<style>
/* Texte clignotant */
.clignote {
color: red;
font-weight: bold;
animation: clignoter 1s infinite;
margin: 0;
}
@keyframes clignoter {
0% { opacity: 1; }
50% { opacity: 0; }
100% { opacity: 1; }
}

/* Texte doré scintillant */
.dore {
font-weight: bold;
font-size: 25px; /* plus gros */
background: linear-gradient(270deg, #FFD700, #FFA500, #FFD700, #FFF5BA);
background-size: 400% 400%;
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
animation: paillettes 5s ease infinite, clignoter 2s infinite;
margin-top: -10px;
position: relative;
z-index: 2;
}
@keyframes paillettes {
0% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}

/* Conteneur paillettes */
.paillettes-container {
position: relative;
display: inline-block;
}
.paillettes-container .sparkle {
position: absolute;
width: 6px;
height: 6px;
background: radial-gradient(circle, #fff 0%, #FFD700 60%, transparent 100%);
border-radius: 50%;
animation: sparkleFall 5s linear infinite;
opacity: 0.8;
}
@keyframes sparkleFall {
from { transform: translateY(-20px) scale(0.5); opacity: 1; }
to { transform: translateY(60px) scale(0); opacity: 0; }
}

/* Style global */
body {
text-align: center;
font-family: Arial, sans-serif;
background: #f9f9f9;
overflow-x: hidden;
}

/* Catalogue et images avec hover */
.catalogue, .img-wrapper img {
max-width: 100%;
height: auto;
display: block;
margin: 20px auto;
cursor: pointer;
position: relative;
transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.catalogue:hover, .img-wrapper img:hover {
transform: scale(1.05);
box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

/* Slider du catalogue */
#catalogue-slider img {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: auto;
opacity: 0;
transition: opacity 1s ease-in-out;
}
#catalogue-slider img.active-slide {
opacity: 1;
z-index: 1;
}

/* Galerie lightbox principale (slider) */
#gallery {
display: none;
position: fixed;
top:0; left:0;
width:100%;
height:100%;
background: rgba(0,0,0,0.9);
text-align: center;
overflow: hidden;
z-index: 1000;
}
#gallery img.main-img {
max-width: 80%;
max-height: 70%;
margin: 20px auto;
display: none;
transition: opacity 0.5s ease;
}
#gallery img.active {
display: block;
opacity: 1;
}
#gallery .thumbnails {
display: flex;
justify-content: center;
margin-top: 15px;
gap: 10px;
}
#gallery .thumbnails img {
width: 80px;
height: 80px;
object-fit: cover;
cursor: pointer;
opacity: 0.7;
border: 2px solid transparent;
transition: transform 0.3s, opacity 0.3s, border 0.3s;
}
#gallery .thumbnails img:hover, #gallery .thumbnails img.active-thumb {
transform: scale(1.1);
opacity: 1;
border: 2px solid red;
}
#gallery button, #gallery span {
margin: 10px;
padding: 10px 20px;
font-size: 18px;
cursor: pointer;
background: #fff;
border: none;
border-radius: 5px;
}
#gallery span {
color: white;
font-size: 24px;
cursor: pointer;
}
#gallery h2 {
color: white;
margin-top: 20px;
}

/* Galeries individuelles pour chaque image */
.gallery-inline {
display:none;
position: fixed;
top:0; left:0;
width:100%; height:100%;
background: rgba(0,0,0,0.9);
z-index: 1000;
text-align:center;
}
.gallery-inline img.main-img {
max-width: 80%;
max-height: 70%;
margin:20px auto;
display:block;
}
.gallery-inline .thumbnails {
display:flex;
justify-content:center;
gap:10px;
margin-top:15px;
}
.gallery-inline .thumbnails img {
width:80px;
height:80px;
cursor:pointer;
opacity:0.7;
border:2px solid transparent;
transition: transform 0.3s, opacity 0.3s, border 0.3s;
}
.gallery-inline .thumbnails img:hover, .gallery-inline .thumbnails img.active-thumb {
transform: scale(1.1);
opacity: 1;
border: 2px solid red;
}
.gallery-inline span.close-btn {
position:absolute;
top:10px;
right:10px;
color:white;
font-size:24px;
cursor:pointer;
}
</style>
</head>
<body>

<h1 style="color: red;">LIVRAISON OFFERTE DÈS 20 € !</h1>

<!-- Texte doré + paillettes -->
<div class="paillettes-container">
<p class="dore">Bijoux acier inoxydable ✨</p>
</div>

<!-- Slider principal -->
<div id="catalogue-slider" class="catalogue" onclick="openGallery(0)">
<img src="CHEZGABYBIJOUx.png" class="active-slide" loading="lazy">
<img src="CHEZ.png" loading="lazy">
<img src="CHEZGABBIJOUX.png" loading="lazy">
<img src="CHEZGABYBI.png" loading="lazy">
</div>

<!-- Images individuelles avec galerie -->
<div class="img-wrapper">
<img src="CHEZ.png" onclick="openGalleryInline('galleryCHEZ')">
<p class="clignote" style="position:absolute; top:5px; left:5px;">Cliquez ici 👇</p>
</div>
<div class="img-wrapper">
<img src="CHEZGABBIJOUX.png" onclick="openGalleryInline('galleryCHEZGABBIJOUX')">
<p class="clignote" style="position:absolute; top:5px; left:5px;">Cliquez ici 👇</p>
</div>
<div class="img-wrapper">
<img src="CHEZGABYBI.png" onclick="openGalleryInline('galleryCHEZGABYBI')">
<p class="clignote" style="position:absolute; top:5px; left:5px;">Cliquez ici 👇</p>
</div>
<div class="img-wrapper">
<img src="bracelet.png" onclick="openGalleryInline('galleryBRACELET')">
<p class="clignote" style="position:absolute; top:5px; left:5px;">Cliquez ici 👇</p>
</div>

<!-- Galeries individuelles -->
<div id="galleryCHEZ" class="gallery-inline">
<h2 style="color:white; margin-top:20px;">Galerie CHEZ</h2>
<img src="image1.png" class="main-img">
<img src="image2.png" class="main-img" style="display:none;">
<div class="thumbnails">
<img src="image1.png" onclick="showInline('galleryCHEZ',0)">
<img src="image2.png" onclick="showInline('galleryCHEZ',1)">
</div>
<span class="close-btn" onclick="closeGalleryInline('galleryCHEZ')">✖</span>
</div>

<div id="galleryCHEZGABBIJOUX" class="gallery-inline">
<h2 style="color:white; margin-top:20px;">Galerie CHEZGABBIJOUX</h2>
<img src="image1.png" class="main-img">
<img src="image2.png" class="main-img" style="display:none;">
<div class="thumbnails">
<img src="image1.png" onclick="showInline('galleryCHEZGABBIJOUX',0)">
<img src="image2.png" onclick="showInline('galleryCHEZGABBIJOUX',1)">
</div>
<span class="close-btn" onclick="closeGalleryInline('galleryCHEZGABBIJOUX')">✖</span>
</div>

<div id="galleryCHEZGABYBI" class="gallery-inline">
<h2 style="color:white; margin-top:20px;">Galerie CHEZGABYBI</h2>
<img src="image1.png" class="main-img">
<img src="image2.png" class="main-img" style="display:none;">
<div class="thumbnails">
<img src="image1.png" onclick="showInline('galleryCHEZGABYBI',0)">
<img src="image2.png" onclick="showInline('galleryCHEZGABYBI',1)">
</div>
<span class="close-btn" onclick="closeGalleryInline('galleryCHEZGABYBI')">✖</span>
</div>

<div id="galleryBRACELET" class="gallery-inline">
<h2 style="color:white; margin-top:20px;">Galerie Bracelet</h2>
<img src="image1.png" class="main-img">
<img src="image2.png" class="main-img" style="display:none;">
<div class="thumbnails">
<img src="image1.png" onclick="showInline('galleryBRACELET',0)">
<img src="image2.png" onclick="showInline('galleryBRACELET',1)">
</div>
<span class="close-btn" onclick="closeGalleryInline('galleryBRACELET')">✖</span>
</div>

<script>
// Slider principal
let catalogueIndex = 0;
const catalogueSlides = document.querySelectorAll("#catalogue-slider img");
catalogueSlides[catalogueIndex].classList.add("active-slide");

function showNextCatalogueSlide() {
catalogueSlides.forEach((img) => img.classList.remove("active-slide"));
catalogueSlides[catalogueIndex].classList.add("active-slide");
catalogueIndex = (catalogueIndex + 1) % catalogueSlides.length;
}
setInterval(showNextCatalogueSlide, 3000);

// Galeries individuelles
function openGalleryInline(id) {
document.getElementById(id).style.display = "block";
showInline(id,0);
}
function closeGalleryInline(id) {
document.getElementById(id).style.display = "none";
}
function showInline(id,index) {
const gallery = document.getElementById(id);
const imgs = gallery.querySelectorAll('.main-img');
imgs.forEach((img,i)=>{ img.style.display = (i===index) ? "block" : "none"; });
}
</script>
</body>
</html>
