<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>mon premier site</title>
<style>
/* Texte clignotant */
.clignote {
color: red;
font-weight: bold;
animation: clignoter 1s infinite;
text-align: left;
margin: 0;
}
@keyframes clignoter {
0% { opacity: 1; }
50% { opacity: 0; }
100% { opacity: 1; }
}

/* Texte doré scintillant */
.dore {
font-weight: bold;
font-size: 28px; /* texte plus gros */
background: linear-gradient(270deg, #FFD700, #FFA500, #FFD700, #FFF5BA);
background-size: 400% 400%;
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
animation: paillettes 5s ease infinite, clignoter 2s infinite;
margin-top: -10px;
position: relative;
z-index: 2;
}
@keyframes paillettes {
0% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}

/* Conteneur paillettes */
.paillettes-container {
position: relative;
display: inline-block;
}
.paillettes-container .sparkle {
position: absolute;
width: 6px;
height: 6px;
background: radial-gradient(circle, #fff 0%, #FFD700 60%, transparent 100%);
border-radius: 50%;
animation: sparkleFall 5s linear infinite;
opacity: 0.8;
}
@keyframes sparkleFall {
from { transform: translateY(-20px) scale(0.5); opacity: 1; }
to { transform: translateY(60px) scale(0); opacity: 0; }
}

/* Style global */
body {
text-align: center;
font-family: Arial, sans-serif;
background: #f9f9f9;
overflow-x: hidden;
}

/* Images cliquables avec zoom */
.catalogue {
max-width: 100%;
height: auto;
display: block;
margin: 20px auto;
cursor: pointer;
transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.catalogue:hover {
transform: scale(1.05);
box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

/* Galerie lightbox */
.gallery-container {
display: none;
position: fixed;
top:0;
left:0;
width:100%;
height:100%;
background: rgba(0,0,0,0.9);
text-align: center;
overflow: hidden;
z-index: 1000;
}
.gallery-container img.main-img {
max-width: 80%;
max-height: 70%;
margin: 20px auto;
display: none;
transition: opacity 0.5s ease;
}
.gallery-container img.active {
display: block;
opacity: 1;
}
.gallery-container .thumbnails {
display: flex;
justify-content: center;
margin-top: 15px;
gap: 10px;
}
.gallery-container .thumbnails img {
width: 80px;
height: 80px;
object-fit: cover;
cursor: pointer;
opacity: 0.7;
border: 2px solid transparent;
transition: transform 0.3s, opacity 0.3s, border 0.3s;
}
.gallery-container .thumbnails img:hover,
.gallery-container .thumbnails img.active-thumb {
transform: scale(1.1);
opacity: 1;
border: 2px solid red;
}
.gallery-container button, .gallery-container span {
margin: 10px;
padding: 10px 20px;
font-size: 18px;
cursor: pointer;
background: #fff;
border: none;
border-radius: 5px;
}
.gallery-container span {
color: white;
font-size: 24px;
cursor: pointer;
}
.gallery-container h2 {
color: white;
margin-top: 20px;
}

/* Texte cliquez ici sur chaque image */
.img-wrapper {
position: relative;
display: inline-block;
margin: 20px auto;
}
.img-wrapper p.clignote {
position: absolute;
bottom: 5px;
left: 5px;
}
</style>
</head>
<body>

<h1 style="color: red;">LIVRAISON OFFERTE DÈS 20 € !</h1>

<div class="paillettes-container">
<p class="dore">Bijoux acier inoxydable ✨</p>
</div>

<!-- Catalogue avec chaque image dans wrapper -->
<div class="img-wrapper">
<img src="CHEZGABYBIJOUx.png" class="catalogue" onclick="openGallery(0)">
<p class="clignote">Cliquez ici 👇</p>
</div>

<div class="img-wrapper">
<img src="CHEZ.png" class="catalogue" onclick="openGalleryLogo('galleryCHEZ')">
<p class="clignote">Cliquez ici 👇</p>
</div>

<div class="img-wrapper">
<img src="CHEZGABBIJOUX.png" class="catalogue" onclick="openGalleryLogo('galleryCHEZGAB')">
<p class="clignote">Cliquez ici 👇</p>
</div>

<div class="img-wrapper">
<img src="CHEZGABYBI.png" class="catalogue" onclick="openGalleryLogo('galleryCHEZGABY')">
<p class="clignote">Cliquez ici 👇</p>
</div>

<div class="img-wrapper">
<img src="bracelet.png" class="catalogue" onclick="openGalleryLogo('galleryBracelet')">
<p class="clignote">Cliquez ici 👇</p>
</div>

<p style="color: blue;">catalogue bijoux acier inoxydable 974</p>

<!-- Galerie première image inchangée -->
<div id="gallery">
<h2>Galerie</h2>
<img src="10.png" alt="10.png" class="main-img">
<img src="dimond.png" alt="Photo 2" class="main-img">
<img src="bouclé.png" alt="Photo 4" class="main-img">
<img src="ceinturclose.png" alt="Photo 5" class="main-img">
<img src="double.png" alt="Photo 6" class="main-img">

<div class="thumbnails">
<img src="10.png" onclick="showImage(0)">
<img src="dimond.png" onclick="showImage(1)">
<img src="bouclé.png" onclick="showImage(3)">
<img src="ceinturclose.png" onclick="showImage(4)">
<img src="double.png" onclick="showImage(5)">
</div>

<div>
<button onclick="prevImage()">⬅ Précédent</button>
<button onclick="nextImage()">Suivant ➡</button>
<span onclick="closeGallery()">Fermer ✖</span>
</div>
</div>

<!-- Nouvelles galleries pour chaque image -->
<div id="galleryCHEZ" class="gallery-container">
<h2>Galerie CHEZ</h2>
<img src="imageA.png" class="main-img">
<img src="imageB.png" class="main-img">
<div class="thumbnails">
<img src="imageA.png" onclick="showImageLogo('galleryCHEZ',0)">
<img src="imageB.png" onclick="showImageLogo('galleryCHEZ',1)">
</div>
<button onclick="prevImageLogo('galleryCHEZ')">⬅ Précédent</button>
<button onclick="nextImageLogo('galleryCHEZ')">Suivant ➡</button>
<span onclick="closeGalleryLogo('galleryCHEZ')">Fermer ✖</span>
</div>

<div id="galleryCHEZGAB" class="gallery-container">
<h2>Galerie CHEZGABBIJOUX</h2>
<!-- Ajouter images -->
</div>

<div id="galleryCHEZGABY" class="gallery-container">
<h2>Galerie CHEZGABYBI</h2>
<!-- Ajouter images -->
</div>

<div id="galleryBracelet" class="gallery-container">
<h2>Galerie Bracelet</h2>
<!-- Ajouter images -->
</div>

<script>
// Paillettes
const container = document.querySelector('.paillettes-container');
for (let i = 0; i < 20; i++) {
let sparkle = document.createElement('div');
sparkle.classList.add('sparkle');
sparkle.style.left = Math.random() * 100 + '%';
sparkle.style.animationDuration = (2 + Math.random() * 3) + 's';
sparkle.style.animationDelay = Math.random() * 5 + 's';
container.appendChild(sparkle);
}

// Slider première galerie
let catalogueIndex = 0;
const catalogueSlides = document.querySelectorAll("#catalogue-slider img");
catalogueSlides.forEach((img, i) => img.classList.remove("active-slide"));
catalogueSlides[catalogueIndex].classList.add("active-slide");
function showNextCatalogueSlide() {
catalogueSlides.forEach((img) => img.classList.remove("active-slide"));
catalogueSlides[catalogueIndex].classList.add("active-slide");
catalogueIndex = (catalogueIndex + 1) % catalogueSlides.length;
}
setInterval(showNextCatalogueSlide, 3000);

// Galerie première image inchangée
let currentIndex = 0;
const mainImages = document.querySelectorAll("#gallery .main-img");
const thumbs = document.querySelectorAll("#gallery .thumbnails img");
let sliderInterval;
function openGallery(index) {
currentIndex = index;
updateGallery();
document.getElementById("gallery").style.display = "block";
startSlider();
}
function closeGallery() {
document.getElementById("gallery").style.display = "none";
stopSlider();
}
function showImage(index) {
currentIndex = index;
updateGallery();
resetSlider();
}
function updateGallery() {
mainImages.forEach((img, i) => {
img.classList.toggle("active", i === currentIndex);
thumbs[i].classList.toggle("active-thumb", i === currentIndex);
});
}
function prevImage() {
currentIndex = (currentIndex - 1 + mainImages.length) % mainImages.length;
updateGallery();
resetSlider();
}
function nextImage() {
currentIndex = (currentIndex + 1) % mainImages.length;
updateGallery();
resetSlider();
}
function startSlider() {
sliderInterval = setInterval(() => { nextImage(); }, 3000);
}
function stopSlider() {
clearInterval(sliderInterval);
}
function resetSlider() {
stopSlider();
startSlider();
}

// Nouvelles galleries
let currentIndexLogo = 0;
let sliderIntervalLogo;
let currentGallery = '';

function openGalleryLogo(id) {
currentGallery = id;
currentIndexLogo = 0;
updateGalleryLogo(id);
document.getElementById(id).style.display = "block";
startSliderLogo(id);
}

function closeGalleryLogo(id) {
document.getElementById(id).style.display = "none";
stopSliderLogo();
}

function showImageLogo(id, index) {
currentGallery = id;
currentIndexLogo = index;
updateGalleryLogo(id);
resetSliderLogo(id);
}

function updateGalleryLogo(id) {
const gallery = document.getElementById(id);
const mainImages = gallery.querySelectorAll('.main-img');
const thumbs = gallery.querySelectorAll('.thumbnails img');
mainImages.forEach((img,i) => img.classList.toggle('active', i === currentIndexLogo));
thumbs.forEach((thumb,i) => thumb.classList.toggle('active-thumb', i === currentIndexLogo));
}

function startSliderLogo(id) {
sliderIntervalLogo = setInterval(() => { nextImageLogo(id); }, 3000);
}

function stopSliderLogo() {
clearInterval(sliderIntervalLogo);
}

function resetSliderLogo(id) {
stopSliderLogo();
startSliderLogo(id);
}

function nextImageLogo(id) {
const gallery = document.getElementById(id);
const mainImages = gallery.querySelectorAll('.main-img');
currentIndexLogo = (currentIndexLogo + 1) % mainImages.length;
updateGalleryLogo(id);
}

function prevImageLogo(id) {
const gallery = document.getElementById(id);
const mainImages = gallery.querySelectorAll('.main-img');
currentIndexLogo = (currentIndexLogo - 1 + mainImages.length) % mainImages.length;
updateGalleryLogo(id);
}
</script>

</body>
</html>
