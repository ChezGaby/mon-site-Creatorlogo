

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>mon premier site</title>
<style>
/* Texte clignotant */
.clignote {
color: red;
font-weight: bold;
animation: clignoter 1s infinite;
text-align: left;
margin-left: 20px;
}
@keyframes clignoter {
0% { opacity: 1; }
50% { opacity: 0; }
100% { opacity: 1; }
}

/* Style global */
body {
text-align: center;
font-family: Arial, sans-serif;
background: #f9f9f9;
}

/* Images catalogue */
.catalogue {
max-width: 100%;
height: auto;
display: block;
margin: 20px auto;
cursor: pointer;
transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.catalogue:hover {
transform: scale(1.05);
box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

/* Galerie lightbox */
#gallery {
display: none;
position: fixed;
top:0;
left:0;
width:100%;
height:100%;
background: rgba(0,0,0,0.9);
text-align: center;
overflow: hidden;
z-index: 1000;
}

#gallery img.main-img {
max-width: 80%;
max-height: 70%;
margin: 20px auto;
display: none;
transition: opacity 0.5s ease;
}

#gallery img.active {
display: block;
opacity: 1;
}

#gallery .thumbnails {
display: flex;
justify-content: center;
margin-top: 15px;
gap: 10px;
}

#gallery .thumbnails img {
width: 80px;
height: 80px;
object-fit: cover;
cursor: pointer;
opacity: 0.7;
border: 2px solid transparent;
transition: transform 0.3s, opacity 0.3s, border 0.3s;
}

#gallery .thumbnails img:hover,
#gallery .thumbnails img.active-thumb {
transform: scale(1.1);
opacity: 1;
border: 2px solid red;
}

#gallery button, #gallery span {
margin: 10px;
padding: 10px 20px;
font-size: 18px;
cursor: pointer;
background: #fff;
border: none;
border-radius: 5px;
}

#gallery span {
color: white;
font-size: 24px;
cursor: pointer;
}

#gallery h2 {
color: white;
margin-top: 20px;
}
</style>
</head>
<body>

<h1 style="color: red;">LIVRAISON OFFERTE DÈS 20 € !</h1>
<p class="clignote">Cliquez ici 👇 </p>

<!-- Catalogue -->
<img src="CHEZGABYBIJOUx.png" alt="Catalogue" class="catalogue" onclick="openGallery(0)" loading="lazy">
<img src="CHEZ.png" alt="logo CHEZ" style="max-width:100%; height:auto; display:block; margin:0 auto 20px auto;" loading="lazy">
<img src="CHEZGABBIJOUX.png" alt="logo CHEZGAB" style="max-width:100%; height:auto; display:block; margin:0 auto 20px auto;" loading="lazy">
<img src="CHEZGABYBI.png" alt="logo CHEZGABYBI" style="max-width:100%; height:auto; display:block; margin:0 auto 20px auto;" loading="lazy">

<p style="color: blue;">catalogue bijoux acier inoxydable 974</p>

<!-- Galerie lightbox -->
<div id="gallery">
<h2>Galerie</h2>

<!-- Images principales -->
<img src="10.png" alt="10.png" class="main-img" loading="lazy">
<img src="photo2.png" alt="Photo 2" class="main-img" loading="lazy">
<img src="photo3.png" alt="Photo 3" class="main-img" loading="lazy">
<img src="photo4.png" alt="Photo 4" class="main-img" loading="lazy">
<img src="photo5.png" alt="Photo 5" class="main-img" loading="lazy">
<img src="photo6.png" alt="Photo 6" class="main-img" loading="lazy">

<!-- Miniatures -->
<div class="thumbnails">
<img src="10.png" onclick="showImage(0)" loading="lazy">
<img src="photo2.png" onclick="showImage(1)" loading="lazy">
<img src="photo3.png" onclick="showImage(2)" loading="lazy">
<img src="photo4.png" onclick="showImage(3)" loading="lazy">
<img src="photo5.png" onclick="showImage(4)" loading="lazy">
<img src="photo6.png" onclick="showImage(5)" loading="lazy">
</div>

<!-- Contrôles -->
<div>
<button onclick="prevImage()">⬅ Précédent</button>
<button onclick="nextImage()">Suivant ➡</button>
<span onclick="closeGallery()">Fermer ✖</span>
</div>
</div>

<script>
let currentIndex = 0;
const mainImages = document.querySelectorAll("#gallery .main-img");
const thumbs = document.querySelectorAll("#gallery .thumbnails img");
let sliderInterval;

// Ouvrir galerie
function openGallery(index) {
currentIndex = index;
updateGallery();
document.getElementById("gallery").style.display = "block";
startSlider();
}

// Fermer galerie
function closeGallery() {
document.getElementById("gallery").style.display = "none";
stopSlider();
}

// Afficher image sélectionnée
function showImage(index) {
currentIndex = index;
updateGallery();
resetSlider();
}

// Mise à jour affichage images et miniatures
function updateGallery() {
mainImages.forEach((img, i) => {
img.classList.toggle("active", i === currentIndex);
thumbs[i].classList.toggle("active-thumb", i === currentIndex);
});
}

// Navigation
function prevImage() {
currentIndex = (currentIndex - 1 + mainImages.length) % mainImages.length;
updateGallery();
resetSlider();
}

function nextImage() {
currentIndex = (currentIndex + 1) % mainImages.length;
updateGallery();
resetSlider();
}

// Slider automatique
function startSlider() {
sliderInterval = setInterval(() => {
nextImage();
}, 3000);
}

function stopSlider() {
clearInterval(sliderInterval);
}

function resetSlider() {
stopSlider();
startSlider();
}

// Likes et panier
let likes = {};
function like(id) {
if(!likes[id]) likes[id] = 0;
likes[id]++;
document.getElementById(id + "-count").innerText = likes[id];
}

let cart = [];
function addToCart(item) {
cart.push(item);
alert(item + " ajouté au panier !");
console.log(cart);
}
</script>

</body>
</html>
